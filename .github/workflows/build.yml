name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # Hem APK hem de AAB dosyasını aynı anda derliyoruz
    - name: Build APK and AAB with Gradle
      run: gradle assembleDebug bundleDebug

    # APK Çıktısını Yükleme
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # AAB (App Bundle) Çıktısını Yükleme
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-aab
        path: app/build/outputs/bundle/debug/app-debug.aab
